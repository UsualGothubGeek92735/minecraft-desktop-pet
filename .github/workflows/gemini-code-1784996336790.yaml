name: Build App Binaries

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-mac:
    name: Build macOS DMG
    runs-on: macos-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Build macOS App with PyInstaller
      run: |
        pyinstaller --windowed --noconfirm pet_app.py

    - name: Create DMG package
      run: |
        hdiutil create -volname "Minecraft Desktop Pet" -srcfolder dist/pet_app.app -ov -format UDZO MinecraftPet.dmg

    - name: Upload DMG Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MinecraftPet-macOS-DMG
        path: MinecraftPet.dmg

  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        if (Test-Path requirements.txt) { pip install -r requirements.txt }

    - name: Build EXE with PyInstaller
      run: |
        pyinstaller --onefile --noconfirm --windowed pet_app.py

    - name: Upload EXE Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MinecraftPet-Windows-EXE
        path: dist/pet_app.exe
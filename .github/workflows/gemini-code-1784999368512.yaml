name: Build App Binaries

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-mac:
    name: Build macOS DMG
    runs-on: macos-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller pygame
        if [ -f minecraft_pet/requirements.txt ]; then pip install -r minecraft_pet/requirements.txt; fi

    - name: Build macOS App with PyInstaller
      working-directory: ./minecraft_pet
      run: |
        pyinstaller --windowed --noconfirm --add-data "assets:assets" --add-data "sounds:sounds" pet_app.py

    - name: Prepare DMG Contents
      run: |
        mkdir dmg_staging
        cp -r minecraft_pet/dist/pet_app.app dmg_staging/
        ln -s /Applications dmg_staging/Applications

    - name: Create DMG package
      run: |
        hdiutil create -volname "Minecraft Desktop Pet" -srcfolder dmg_staging -ov -format UDZO MinecraftPet.dmg

    - name: Upload DMG Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MinecraftPet-macOS-DMG
        path: MinecraftPet.dmg

  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller pygame
        if (Test-Path minecraft_pet/requirements.txt) { pip install -r minecraft_pet/requirements.txt }

    - name: Build EXE with PyInstaller
      working-directory: ./minecraft_pet
      run: |
        pyinstaller --onefile --windowed --noconfirm --add-data "assets;assets" --add-data "sounds;sounds" pet_app.py

    - name: Upload EXE Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MinecraftPet-Windows-EXE
        path: minecraft_pet/dist/pet_app.exe